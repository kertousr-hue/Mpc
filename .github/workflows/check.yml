name: Vérification MPC Studio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier JavaScript
        run: |
          node --check app.js
          node --check api-services.js
          node --check pwa.js
          node --check dj.js
          node --check virtualdj.js
      - name: Vérifier Python
        run: python -m py_compile virtualdj_bridge.py
      - name: Vérifier les fichiers essentiels
        run: |
          test -f index.html
          test -f styles.css
          test -f api-services.js
          test -f pwa.js
          test -f dj.js
          test -f dj.css
          test -f virtualdj.js
          test -f virtualdj.css
          test -f virtualdj_bridge.py
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f supabase-schema.sql
          test -f supabase-config.js
          test -f manifest.webmanifest
          test -f sw.js

      - name: Vérifier le manifeste PWA
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
