name: Déployer MPC Studio sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js api-services.js api-dj.js api-dj.css pwa.js audio-tap.js dj.js dj.css dj-sync.js dj-recorder.js dj-android-recorder.js virtualdj.js virtualdj.css virtualdj-files.js virtualdj-catalogs.js supabase-config.js manifest.webmanifest sw.js _site/
          cp -R icons _site/icons
          touch _site/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoyer les fichiers Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
